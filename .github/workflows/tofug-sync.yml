name: TOFU·G Sheet Sync

# 구글 시트/평점을 하루 1회 읽어 generated.json 을 갱신·커밋합니다.
# (방문자 부하 0 — 사이트는 커밋된 JSON 만 읽음)

on:
  schedule:
    - cron: '0 18 * * *'      # 매일 UTC 18:00 = KST 03:00
  workflow_dispatch:           # 수동 실행 버튼

# 커밋을 위해 쓰기 권한 필요
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync stores + ratings
        env:
          TOFUG_SHEET_CSV_URL: ${{ secrets.TOFUG_SHEET_CSV_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          TOFUG_FLAGSHIP_PLACE_ID: ${{ secrets.TOFUG_FLAGSHIP_PLACE_ID }}
        run: node scripts/sync-tofug.mjs

      - name: Commit if changed
        run: |
          git config user.name "tofug-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tofug-stores.generated.json data/tofug-stats.generated.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore(tofug): daily sheet/ratings sync"
            git push
          fi
